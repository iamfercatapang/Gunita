<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0b0f">
    <meta http-equiv="Content-Security-Policy"
          content="default-src * 'self' data: blob: 'unsafe-inline' 'unsafe-eval';
                   media-src * blob: data:;
                   connect-src * http: https:;">
    <title>Gunita - Video Guestbook</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- The web app manifest + service worker are generated by vite-plugin-pwa
         (see vite.config.ts), which injects the manifest link at build time. -->
    <!-- iPad / iPhone "Add to Home Screen": Safari reads these instead of the manifest icons. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gunita">

    <!-- Bundled entry: jQuery, PeerJS, FontAwesome, Inter font, typed state + constants. -->
    <script type="module" src="/src/main.ts"></script>

    <!-- Google Identity Services — must remain external (OAuth requires Google's domain). -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- QR Code generator (vendored locally for offline use). -->
    <script src="./vendor/qrcode.min.js" defer></script>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. ADMIN DASHBOARD                         -->
    <!-- ========================================== -->
    <!-- ========== ADMIN DASHBOARD ========== -->
    <!-- Sidebar and settings panels, rendered by React (src/screens/admin)
         from the settings store (src/state/settings.ts). -->
    <div id="admin-dashboard" class="dashboard-layout" data-theme="dark"></div>

    <!-- ========== VIEWER MODE (Device 2 full-screen gallery) ========== -->
    <!-- Rendered by React (src/screens/live-viewer) when the URL has ?viewer=<id>.
         Styled in src/styles/live-viewer.css. -->
    <div id="viewer-mode" data-theme="dark" style="display:none;"></div>

    <!-- ========== KIOSK MODE ========== -->
    <div id="kiosk-mode" data-theme="dark" style="display:none;">
        <!-- ========== WELCOME SCREEN ========== -->
        <!-- Rendered by React (src/screens/welcome); app.js shows and hides it
             through window.PB.ui.showWelcome / hideWelcome. -->
        <div id="kiosk-welcome-root"></div>

        <!-- ========== GUEST FLOW SCREENS ========== -->
        <!-- Prompts preview, photo booth offer and done screen, rendered by
             React (src/screens/guest-flow) when app.js calls window.PB.ui. -->
        <div id="kiosk-guest-screens"></div>

        <!-- ========== RECENT CAPTURES KIOSK MODAL ========== -->
        <!-- Rendered by React (src/screens/galleries) when the guest taps Recent Captures. -->
        <div id="recent-captures-root"></div>

        <!-- ========== CAPTURE SCREENS ========== -->
        <!-- Photo booth, video guestbook, recording preview and camera-lost,
             rendered by React (src/screens/capture). -->
        <div id="kiosk-capture-root"></div>

        <!-- ============================================ -->
    </div>

    <!-- ========== KIOSK DIALOGS ========== -->
    <!-- PIN pad and disclaimer, rendered by React (src/screens/dialogs) when
         app.js calls window.PB.ui.askPin / askDisclaimer. -->
    <div id="kiosk-dialogs"></div>

    <!-- ======================================= -->

    <!-- Legacy app.js — non-module script that consumes the window globals
         set by /src/main.ts: kiosk launch, exit and the PIN (until 4g). -->
    <script src="./app.js" defer></script>

    <!-- The dashboard gallery's lightbox and "View all" window render into
         <body> from src/screens/galleries. -->
</html>
